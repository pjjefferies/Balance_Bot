[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "Balance_Bot"
version = "0.1.0"
authors = [
  { name="Paul Jefferies", email="jefferie@umich.edu" },
]
description = "A Balance Bot implementation"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Linux :: Windows",
]
dependencies = [
    'Adafruit-Blinka>=10.2.0',
    'adafruit-circuitpython-bno055>=5.4.22',
    'bluedot>=2.0.0',
    'gpiozero>=2.0.1',
    'numpy>=2.5.5',
    'pandas>=3.1.1',
    'python-box>=8.0.1',
    'pyttsx3>=2.90',
    'PyYAML>=6.0.4',
    'scipy>=1.18.1',
    "setuptools>=84.2.1",
]

[project.urls]
"Homepage" = "https://github.com/pjjefferies/Balance_Bot"
"Bug Tracker" = "https://github.com/pjjefferies/Balance_Bot/issues"


[tool.pytest.ini_options]
# pythonpath = [
#   "src"
# ]
addopts = ["--cov=src", "--cov-report=html", "--cov-report=term-missing", "--cov-fail-under=95"]
# branch = true
# maxfail = 10
# omit = "tests"
# source = "scr"
testpaths = "tests"

[dependency-groups]
dev = [
    "astroid>=3.3.11",
    "black>=25.1.0",
    # click  # used by black
    # colorama  # used by black
    # dill=0.4.0  # used by pylint
    # isort=6.0.1  # used by pylint
    # mccabe=0.7.0  # used by pylint
    "mypy>=1.17.1",
    # mypy_extensions  # used by black, isort, mypy
    # packaging=25.0  # used by setuptools, black
    # pathspec=0.12.1  # used by black, mypy
    # pip=25.2
    # platformdirs=4.3.8  # used by black, etc.
    "pylint>=3.3.8",
]

[tool.pyrefly]
project-includes = ["src", "tests"]
search-path = ["."]  # Forces Pyrefly to resolve packages starting from the repository root
